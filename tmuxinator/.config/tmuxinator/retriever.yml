name: retriever
root: ~/dev/retriever

windows:
  - editor:
      layout: main-vertical
      main-pane-width: 70
      panes:
        - " while true; do nvim; done"
        - " while true; do bundle exec guard; done"
  - llm:
      panes:
        - " while true; do claude; done"
  - shell:
  - rails console:
      panes:
        - " while true; do bin/rails console; done"
  - server:
      panes:
        - " while true; do TLS=1 bin/rails server -P /tmp/server-retriever.pid; done"
  - db:
      panes:
        - " while true; do psql retriever_development; done"
  - prod logs:
      panes:
        - " "
  - prod status:
      panes:
        - " "

